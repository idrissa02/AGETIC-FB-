<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <title>Résultats</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
  <header th:replace="~{fragments/header :: siteHeader}"></header>

  <main class="container">
    <h2>Voir les résultats</h2>

    <!-- Ask for applicationId; server loads CandidateProfileResponse -->
    <form class="lookup-form" method="get" th:action="@{/resultats}">
      <label for="appId">ID de candidature</label>
      <input id="appId" name="applicationId" type="number" th:value="${param.applicationId}" required />
      <button class="btn-primary" type="submit">Afficher</button>
    </form>

    <!-- Reuse the same fragment as dossier -->
    <!-- <div th:if="${profile != null}" th:replace="~{fragments/profile :: profileView(${profile})}"></div> -->
  </main>
</body>
   <footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</html>
