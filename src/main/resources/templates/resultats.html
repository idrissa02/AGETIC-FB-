<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8" />
  <title>Voir mes résultats</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>

<body>
  <header th:replace="~{fragments/header :: siteHeader}"></header>

  <main class="container">
    <h2>Voir mes résultats</h2>

    <!-- Recherche par numéro candidat -->
    <form class="lookup-form" method="get" th:action="@{/candidats/search}">
      <label for="cand">Numéro candidat</label>
      <input id="cand" name="candidateNumber" type="text" placeholder="Ex: CND-2025-00045"
        th:value="${param.candidateNumber}" required />
      <button class="btn-primary" type="submit">Afficher</button>
    </form>

    <!-- Profil + résultats (le fragment sait afficher notes/tests/pending) -->
    <div th:if="${profile != null}">
      <div th:replace="~{fragments/profile :: profileView(${profile},true)}"></div>
    </div>

    <!-- Candidat trouvé mais résultats pas encore publiés -->
    <div class="empty" th:if="${notPublished}">
      Les résultats pour ce candidat ne sont pas encore publiés.
    </div>

    <!-- Aucun candidat trouvé -->
    <div class="empty" th:if="${notFound}">
      Entrez un numéro de candidat valide ! 
    </div>

  </main>

  <footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</body>

</html>
