<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <title>Mon dossier</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
  <header th:replace="~{fragments/header :: siteHeader}"></header>

  <main class="container">
    <h2>Mon dossier</h2>

    <!-- Lookup form: search by applicationId -->
    <form class="lookup-form" method="get" th:action="@{/applications/search}">
      <label for="appId">Numéro d'Application</label>
      <input id="appId" name="applicationId" type="text" placeholder="Ex: APP 123" required />
      <button type="submit" class="btn-primary">Chercher</button>
    </form>

    <!-- Show profile if present -->
  <div th:if="${profile != null}">
  <div th:replace="~{fragments/profile :: profileView(${profile},false)}"></div>
</div>
    <!-- Optional: empty state -->
    <div th:if="${profile == null}" class="empty">
      Entrez un numéro d'application pour voir votre dossier.
    </div>
  </main>

  <footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</body>
</html>
