<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Gestion des épreuves</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header class="govbar">
  <div class="govbar-inner">
    <div class="govbar-left">
      <img class="gov-emblem" th:src="@{/img/emblem-mali.jpeg}" alt="Emblème du Mali">
      <div class="gov-text">
        <div class="gov-topline">
          <span class="mali-flag" aria-hidden="true"></span>
          <span class="gov-country">République du Mali</span>
        </div>
        <div class="gov-title">
        Administration — Epreuves d’examen
        </div>
      </div>
    </div>
    
  </div>
  <button id="menuToggle" class="menu-toggle" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false">☰</button>
</header>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="admin-profile">
      <div class="avatar" aria-hidden="true">ADM</div>
      <div class="admin-name">@admin</div>
    </div>

    <nav class="menu">
         <a class="menu-item active" th:href="@{/admin/tests}">
        <span class="icon">➕</span>Epreuves
      </a>

       <a class="menu-item active" th:href="@{/admin/categories}">
        <span class="icon">➕</span>Categories
      </a> 
      <a class="menu-item active" th:href="@{/admin/exams}">
        <span class="icon">➕</span>Créer un concours
      </a>

      <a class="menu-item" th:href="@{/admin/centers}">
        <span class="icon">🏫</span>Centres
      </a>
      <a class="menu-item" th:href="@{/admin/classrooms}">
        <span class="icon">🏷️</span>Salles
      </a>

       <a class="menu-item" th:href="@{/admin/applications/manage}">
        <span class="icon">🛠️</span>Gérer les applications
      </a>


      <a class="menu-item" th:href="@{/admin/candidates/manage}">
        <span class="icon">🛠️</span>Gérer les candidatures
      </a>
     
      <div class="menu-sep"></div>
      <a class="menu-item danger" th:href="@{/logout}">
        <span class="icon">🚪</span>Déconnexion
      </a>
    </nav>
  </aside>

<div class="wrap">

  <div th:if="${flashSuccess}" class="flash success" th:text="${flashSuccess}"></div>
  <div th:if="${flashError}"   class="flash error"   th:text="${flashError}"></div>

  <div class="card">
  <h2 th:text="${form.id} != null ? 'Modifier une épreuve' : 'Créer une épreuve'"></h2>

  <!-- actionUrl is provided by the controller -->
  <form th:action="@{${actionUrl}}" method="post" th:object="${form}">
    <input type="hidden" th:field="*{id}"/>

    <label for="examId">Examen</label>
    <select id="examId" th:field="*{examId}" required>
      <option value="" 
              th:if="${form == null or form.examId == null}">
        — choisir un examen —
      </option>
      <option th:each="e : ${exams}" 
              th:value="${e.id}" 
              th:text="${e.title}">
      </option>
    </select>

    <label for="title">Titre</label>
    <input id="title" th:field="*{title}" placeholder="ex: Mathématiques" required/>

    <div class="actions">
      <button class="btn" type="submit"
              th:text="${form.id} != null ? 'Mettre à jour' : 'Créer'"></button>
      <a th:if="${form.id} != null" class="btn-outline" th:href="@{/admin/tests}">Annuler</a>
    </div>
  </form>
</div>


  <div class="card">
    <h3>Liste des épreuves</h3>
    <table>
      <thead>
        <tr><th>ID</th><th>Examen</th><th>Titre</th><th>Actions</th></tr>
      </thead>
      <tbody>
        <tr th:each="t : ${tests}">
          <td th:text="${t.id}">1</td>
          <td th:text="${t.examId}">Exam 1</td>
          <td th:text="${t.title}">Maths</td>
          <td>
            <a th:href="@{'/admin/tests/' + ${t.id} + '/edit'}" class="btn-outline">Modifier</a>
            <form th:action="@{'/admin/tests/' + ${t.id} + '/delete'}" method="post"
                  onsubmit="return confirm('Supprimer cette épreuve ?');">
              <button class="btn btn-danger" type="submit">Supprimer</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tests)}">
          <td colspan="4">Aucune épreuve</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
</body>
</html>
