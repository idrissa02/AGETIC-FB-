<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Panneau d’Administration</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<!-- Top Government Bar -->
<header class="govbar">
  <div class="govbar-inner">
    <div class="govbar-left">
      <img class="gov-emblem" th:src="@{/img/emblem-mali.jpeg}" alt="Emblème du Mali">
      <div class="gov-text">
        <div class="gov-topline">
          <span class="mali-flag" aria-hidden="true"></span>
          <span class="gov-country">République du Mali</span>
        </div>
        <div class="gov-title">
          Portail d’Administration — Concours de la Fonction Publique
        </div>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="admin-profile">
      <div class="avatar" aria-hidden="true">ADM</div>
      <div class="admin-name">@admin</div>
    </div>

    <nav class="menu">
         <a class="menu-item active" th:href="@{/admin/exams/create}">
        <span class="icon">➕</span>Epreuves
      </a>

       <a class="menu-item active" th:href="@{/admin/exams/create}">
        <span class="icon">➕</span>Categories
      </a> 
      <a class="menu-item active" th:href="@{/admin/exams/create}">
        <span class="icon">➕</span>Créer un concours
      </a>

       <a class="menu-item" th:href="@{/admin/applications/manage}">
        <span class="icon">🛠️</span>Gérer les applications
      </a>


      <a class="menu-item" th:href="@{/admin/applications/manage}">
        <span class="icon">🛠️</span>Gérer les candidatures
      </a>
     
      <div class="menu-sep"></div>
      <a class="menu-item danger" th:href="@{/logout}">
        <span class="icon">🚪</span>Déconnexion
      </a>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="content">
    <div class="content-head">
        <h1 class="content-title">Bienvenue sur le Panneau d’Administration</h1></div>

      <div class="dashboard-center">
        <img th:src="@{/img/admin.png}" alt="Dashboard Image" style="max-width:50%;border-radius:500px;box-shadow:0 2px 8px rgba(0,0,0,0.15)" class="admin-icon">
</div>
    
      </main>
</div>

<footer>© Ministère du Travail et de la Fonction Publique</footer>
</body>
</html>
