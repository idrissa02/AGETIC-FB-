spring.application.name=Civil-service-competition

server.port=8081
logging.level.root=ERROR
logging.level.com.AGETIC.Civil_service_competition=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

# File storage configuration
storage.base-dir=uploads




# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/civil_service_competition
spring.datasource.username=postgres
spring.datasource.password=Postgre2002.

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# allow bigger multipart uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Tomcat swallow size (-1 = unlimited; otherwise set a value like 25MB)
server.tomcat.max-swallow-size=25600KB
