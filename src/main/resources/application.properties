spring.application.name=Civil-service-competition

server.port=8081
logging.level.root=ERROR
logging.level.com.AGETIC.Civil_service_competition=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

# File storage configuration
storage.base-dir=uploads




# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/civil_service_competition
spring.datasource.username=postgres
spring.datasource.password=Postgre2002.

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_SMTP_USERNAME
spring.mail.password=YOUR_APP_PASSWORD   # Gmail: use an App Password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# optional default "from"
spring.mail.from=noreply@agetic.ml


